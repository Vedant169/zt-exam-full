# Render Blueprint — deploy as a single Web Service
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: zt-exam
    runtime: python
    buildCommand: pip install -r requirements.txt && cd backend && python seed.py
    startCommand: cd backend && gunicorn app.main:app --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120 --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        value: sqlite:///./zt_exam.db
      - key: SECRET_KEY
        generateValue: true
